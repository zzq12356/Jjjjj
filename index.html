<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手环9 Pro · 丐版泰拉瑞亚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .band-frame {
            width: 336px;
            height: 480px;
            background: #0d0d0d;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 0 3px #2a2a2a;
        }
        canvas {
            display: block;
            width: 336px;
            height: 480px;
            border-radius: 32px;
        }
        .band-strap {
            position: absolute;
            background: #1a1a1a;
            z-index: -1;
        }
        .band-strap.top {
            top: -30px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 40px;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
        }
        .band-strap.bottom {
            bottom: -30px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 40px;
            border-radius: 0 0 8px 8px;
            background: linear-gradient(0deg, #2a2a2a, #1a1a1a);
        }
    </style>
</head>
<body>
    <div class="band-frame">
        <div class="band-strap top"></div>
        <canvas id="game"></canvas>
        <div class="band-strap bottom"></div>
    </div>

    <script>
    (function() {
        'use strict';

        // ==================== 调试 ====================
        window.onerror = function(msg, url, line, col, err) {
            console.error('❌ 游戏出错:', msg, '行:', line, '列:', col);
            document.body.style.background = '#200';
            return false;
        };

        // ==================== 初始化 ====================
        const canvas = document.getElementById('game');
        if (!canvas) {
            console.error('❌ 找不到canvas元素');
            return;
        }
        const ctx = canvas.getContext('2d');
        if (!ctx) {
            console.error('❌ 无法获取2D上下文');
            return;
        }

        const W = 336;
        const H = 480;
        canvas.width = W;
        canvas.height = H;

        console.log('✅ Canvas初始化成功:', W, 'x', H);

        // ==================== 常量 ====================
        const TILE_SIZE = 12;
        const WORLD_W = 2000;
        const WORLD_H = 200;
        const VIEW_TILES_X = Math.ceil(W / TILE_SIZE);
        const VIEW_TILES_Y = Math.ceil(H / TILE_SIZE);
        const GRAVITY = 0.4;
        const PLAYER_SPEED = 1.8;
        const JUMP_FORCE = -4.5;
        const SEED = 12345;
        const CURSOR_MAX_DIST = 3;

        const AIR = 0;
        const DIRT = 1;
        const STONE = 2;
        const GRASS = 3;
        const WOOD = 4;
        const LEAF = 5;
        const COPPER = 6;
        const IRON = 7;
        const SILVER = 8;
        const GOLD = 9;
        const DIAMOND = 10;
        const COAL = 11;
        const CRAFT_TABLE = 12;
        const CHEST = 13;

        const TILE_COLORS = {};
        TILE_COLORS[AIR] = null;
        TILE_COLORS[DIRT] = '#8B5E3C';
        TILE_COLORS[STONE] = '#7F8C8D';
        TILE_COLORS[GRASS] = '#4CAF50';
        TILE_COLORS[WOOD] = '#A0522D';
        TILE_COLORS[LEAF] = '#2E7D32';
        TILE_COLORS[COPPER] = '#E67E22';
        TILE_COLORS[IRON] = '#95A5A6';
        TILE_COLORS[SILVER] = '#BDC3C7';
        TILE_COLORS[GOLD] = '#F1C40F';
        TILE_COLORS[DIAMOND] = '#3498DB';
        TILE_COLORS[COAL] = '#2C3E50';
        TILE_COLORS[CRAFT_TABLE] = '#D4A574';
        TILE_COLORS[CHEST] = '#C0392B';

        const TILE_NAMES = {};
        TILE_NAMES[DIRT] = '泥土';
        TILE_NAMES[STONE] = '石头';
        TILE_NAMES[GRASS] = '草方块';
        TILE_NAMES[WOOD] = '木头';
        TILE_NAMES[LEAF] = '树叶';
        TILE_NAMES[COPPER] = '铜矿';
        TILE_NAMES[IRON] = '铁矿';
        TILE_NAMES[SILVER] = '银矿';
        TILE_NAMES[GOLD] = '金矿';
        TILE_NAMES[DIAMOND] = '钻石';
        TILE_NAMES[COAL] = '煤炭';
        TILE_NAMES[CRAFT_TABLE] = '合成台';
        TILE_NAMES[CHEST] = '箱子';

        console.log('✅ 常量定义完成');

        // ==================== 噪声函数 ====================
        function hash(x, y) {
            let h = SEED + x * 374761393 + y * 668265263;
            h = (h ^ (h >> 13)) * 1274126177;
            return (h ^ (h >> 16)) / 2147483648;
        }

        function smoothNoise(x, y) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            const n00 = hash(ix, iy);
            const n10 = hash(ix + 1, iy);
            const n01 = hash(ix, iy + 1);
            const n11 = hash(ix + 1, iy + 1);
            const nx0 = n00 + (n10 - n00) * sx;
            const nx1 = n01 + (n11 - n01) * sx;
            return nx0 + (nx1 - nx0) * sy;
        }

        function fbm(x, y, octaves) {
            octaves = octaves || 3;
            let val = 0;
            let amp = 0.5;
            let freq = 1;
            let max = 0;
            for (let i = 0; i < octaves; i++) {
                val += smoothNoise(x * freq, y * freq) * amp;
                max += amp;
                amp *= 0.5;
                freq *= 2;
            }
            return val / max;
        }

        console.log('✅ 噪声函数定义完成');

        // ==================== 地形生成 ====================
        function getSurfaceHeight(x) {
            const nx = x / WORLD_W;
            let h = 60;
            h += fbm(x * 0.008, 0, 4) * 25;
            h += fbm(x * 0.03, 100, 2) * 10;
            h += Math.sin(nx * Math.PI * 3) * 8;
            h += Math.sin(nx * Math.PI * 7) * 4;
            return Math.floor(h);
        }

        function getCaveNoise(x, y) {
            const depthFactor = (y - 60) / 140;
            const base = fbm(x * 0.06, y * 0.06, 3);
            const detail = fbm(x * 0.15, y * 0.15, 2) * 0.3;
            const verticalStretch = Math.sin(y * 0.02) * 0.15;
            const horizontalBias = Math.cos(x * 0.04) * 0.1;
            let caveVal = base + detail + verticalStretch + horizontalBias;
            if (y < 65) caveVal += 0.6;
            if (depthFactor > 0.6) caveVal -= depthFactor * 0.4;
            return caveVal;
        }

        function getTileAt(x, y) {
            if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return STONE;
            const surfH = getSurfaceHeight(x);
            if (y < surfH - 1) {
                if (y >= surfH - 8 && y < surfH - 1) {
                    const treeBaseX = Math.floor(x / 6) * 6;
                    const distFromBase = Math.abs(x - (treeBaseX + 2.5));
                    const treeHeight = 4 + Math.floor(hash(treeBaseX, 0) * 5);
                    if (distFromBase < 1.5 && y >= surfH - treeHeight - 2 && y < surfH - 1) {
                        if (y >= surfH - 3 && distFromBase < 0.8) return WOOD;
                        return LEAF;
                    }
                }
                return AIR;
            }
            if (y === surfH - 1) return GRASS;
            if (y >= surfH && y <= surfH + 3) return DIRT;
            const caveVal = getCaveNoise(x, y);
            const isCave = caveVal > 0.45;
            if (isCave && y > surfH + 3) return AIR;
            if (!isCave && y > surfH + 3) {
                const oreNoise = fbm(x * 0.12, y * 0.12, 2);
                const depth = y - surfH;
                if (depth > 80 && oreNoise > 0.72) return DIAMOND;
                if (depth > 60 && oreNoise > 0.62) return GOLD;
                if (depth > 40 && oreNoise > 0.55) return SILVER;
                if (depth > 25 && oreNoise > 0.48) return IRON;
                if (depth > 15 && oreNoise > 0.40) return COPPER;
                if (depth > 10 && oreNoise < -0.55) return COAL;
            }
            if (y > surfH + 80 && !isCave) return STONE;
            if (y > surfH + 6 && !isCave) {
                if (hash(x, y) < 0.75) return STONE;
                return DIRT;
            }
            if (!isCave && y >= surfH) return DIRT;
            return STONE;
        }

        console.log('✅ 地形生成函数定义完成');

        // ==================== 世界覆盖数据 ====================
        let worldOverrides = {};

        function getTileAtWithOverride(x, y) {
            const key = x + ',' + y;
            if (worldOverrides.hasOwnProperty(key)) return worldOverrides[key];
            return getTileAt(x, y);
        }

        function isSolid(tileType) {
            return tileType !== AIR && tileType !== null;
        }

        // ==================== 游戏状态 ====================
        let playerX = WORLD_W / 2;
        let playerY = getSurfaceHeight(Math.floor(playerX)) - 3;
        let velocityX = 0;
        let velocityY = 0;
        let isOnGround = false;
        let facingRight = true;

        // 光标
        let cursorTileX = Math.floor(playerX);
        let cursorTileY = Math.floor(playerY);
        let cursorActive = false;

        // 血量
        let hp = 100;
        const maxHp = 100;

        // 背包
        const backpack = {};
        let selectedSlot = 0;
        const quickSlots = [DIRT, STONE, WOOD, COPPER, null];

        function addToBackpack(tileType, count) {
            count = count || 1;
            if (!tileType || tileType === AIR) return false;
            if (!backpack[tileType]) backpack[tileType] = 0;
            backpack[tileType] += count;
            return true;
        }

        function removeFromBackpack(tileType, count) {
            count = count || 1;
            if (!backpack[tileType] || backpack[tileType] < count) return false;
            backpack[tileType] -= count;
            if (backpack[tileType] <= 0) delete backpack[tileType];
            return true;
        }

        function getBackpackCount(tileType) {
            return backpack[tileType] || 0;
        }

        function getSelectedItem() {
            return quickSlots[selectedSlot];
        }

        // 初始物品
        addToBackpack(DIRT, 20);
        addToBackpack(STONE, 10);
        addToBackpack(WOOD, 5);

        console.log('✅ 游戏状态初始化完成，玩家位置:', playerX.toFixed(1), playerY.toFixed(1));

        // ==================== 碰撞检测 ====================
        function checkCollisionWorld(x, y, w, h) {
            const left = Math.floor(x);
            const right = Math.floor(x + w - 0.01);
            const top = Math.floor(y);
            const bottom = Math.floor(y + h - 0.01);
            for (let cy = top; cy <= bottom; cy++) {
                for (let cx = left; cx <= right; cx++) {
                    if (cx >= 0 && cx < WORLD_W && cy >= 0 && cy < WORLD_H) {
                        if (isSolid(getTileAtWithOverride(cx, cy))) return true;
                    } else if (cx < 0 || cx >= WORLD_W || cy >= WORLD_H) {
                        return true;
                    }
                }
            }
            return false;
        }

        function removeTileWorld(tx, ty) {
            const key = tx + ',' + ty;
            const original = getTileAtWithOverride(tx, ty);
            if (isSolid(original) && original !== CRAFT_TABLE) {
                worldOverrides[key] = AIR;
                return original;
            }
            return null;
        }

        function placeTileWorld(tx, ty, tileType) {
            const key = tx + ',' + ty;
            const original = getTileAtWithOverride(tx, ty);
            if (!isSolid(original)) {
                const px = Math.floor(playerX);
                const py = Math.floor(playerY);
                if (tx === px && (ty === py || ty === py + 1)) return false;
                worldOverrides[key] = tileType;
                return true;
            }
            return false;
        }

        // 初始化合成台
        (function() {
            const cx = Math.floor(WORLD_W / 2) - 10;
            const cy = getSurfaceHeight(cx) - 1;
            worldOverrides[cx + ',' + cy] = CRAFT_TABLE;
            worldOverrides[(cx + 1) + ',' + cy] = CRAFT_TABLE;
        })();

        console.log('✅ 碰撞检测和世界修改函数完成');

        // ==================== 相机 ====================
        let cameraX = playerX - VIEW_TILES_X / 2;
        let cameraY = playerY - VIEW_TILES_Y / 2;

        function updateCamera() {
            const targetX = playerX - VIEW_TILES_X / 2;
            const targetY = playerY - VIEW_TILES_Y / 2;
            cameraX += (targetX - cameraX) * 0.15;
            cameraY += (targetY - cameraY) * 0.15;
            cameraX = Math.max(0, Math.min(WORLD_W - VIEW_TILES_X, cameraX));
            cameraY = Math.max(0, Math.min(WORLD_H - VIEW_TILES_Y, cameraY));
        }

        console.log('✅ 相机初始化完成');

        // ==================== 输入 ====================
        const keys = {
            up: false, down: false, left: false, right: false,
            jump: false, a: false, b: false
        };
        let joystickActive = false;
        let joystickId = null;
        let joystickDX = 0;
        let joystickDY = 0;

        // 右下角摇杆
        const JOYSTICK_CX = 280;
        const JOYSTICK_CY = 410;
        const JOYSTICK_RADIUS = 38;
        const JOYSTICK_KNOB_R = 14;
        const JOYSTICK_DEAD_ZONE = 6;

        const BTN_R = 13;
        const BTN_A_POS = { x: JOYSTICK_CX - 30, y: JOYSTICK_CY - 48, r: BTN_R };
        const BTN_JUMP_POS = { x: JOYSTICK_CX + 32, y: JOYSTICK_CY - 38, r: BTN_R };
        const BTN_B_POS = { x: JOYSTICK_CX - 42, y: JOYSTICK_CY - 10, r: BTN_R };

        // 左下方向键
        const DPAD = {
            up:    { cx: 52, cy: 392, r: 16 },
            down:  { cx: 52, cy: 444, r: 16 },
            left:  { cx: 24, cy: 418, r: 16 },
            right: { cx: 80, cy: 418, r: 16 }
        };

        // 物品栏
        const INV_X = 6;
        const INV_Y = 100;
        const INV_SIZE = 34;
        const INV_ARROW_UP = { x: INV_X + INV_SIZE / 2, y: INV_Y - 16, r: 12 };
        const INV_ARROW_DOWN = { x: INV_X + INV_SIZE / 2, y: INV_Y + INV_SIZE + 16, r: 12 };

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function dist(x1, y1, x2, y2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function isInCircle(px, py, cx, cy, r) {
            return dist(px, py, cx, cy) <= r;
        }

        canvas.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            const pos = getTouchPos(e);

            // 摇杆
            if (dist(pos.x, pos.y, JOYSTICK_CX, JOYSTICK_CY) < JOYSTICK_RADIUS + 10) {
                joystickActive = true;
                joystickId = e.pointerId;
                joystickDX = 0;
                joystickDY = 0;
                cursorActive = true;
                return;
            }

            if (isInCircle(pos.x, pos.y, BTN_A_POS.x, BTN_A_POS.y, BTN_A_POS.r + 4)) {
                keys.a = true;
                return;
            }
            if (isInCircle(pos.x, pos.y, BTN_B_POS.x, BTN_B_POS.y, BTN_B_POS.r + 4)) {
                keys.b = true;
                return;
            }
            if (isInCircle(pos.x, pos.y, BTN_JUMP_POS.x, BTN_JUMP_POS.y, BTN_JUMP_POS.r + 4)) {
                keys.jump = true;
                return;
            }

            if (isInCircle(pos.x, pos.y, DPAD.up.cx, DPAD.up.cy, DPAD.up.r + 4)) { keys.up = true; return; }
            if (isInCircle(pos.x, pos.y, DPAD.down.cx, DPAD.down.cy, DPAD.down.r + 4)) { keys.down = true; return; }
            if (isInCircle(pos.x, pos.y, DPAD.left.cx, DPAD.left.cy, DPAD.left.r + 4)) { keys.left = true; return; }
            if (isInCircle(pos.x, pos.y, DPAD.right.cx, DPAD.right.cy, DPAD.right.r + 4)) { keys.right = true; return; }

            if (isInCircle(pos.x, pos.y, INV_ARROW_UP.x, INV_ARROW_UP.y, INV_ARROW_UP.r + 4)) {
                selectedSlot = (selectedSlot - 1 + quickSlots.length) % quickSlots.length;
                return;
            }
            if (isInCircle(pos.x, pos.y, INV_ARROW_DOWN.x, INV_ARROW_DOWN.y, INV_ARROW_DOWN.r + 4)) {
                selectedSlot = (selectedSlot + 1) % quickSlots.length;
                return;
            }
        });

        canvas.addEventListener('pointermove', function(e) {
            if (!joystickActive) return;
            const pos = getTouchPos(e);
            const dx = pos.x - JOYSTICK_CX;
            const dy = pos.y - JOYSTICK_CY;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < JOYSTICK_DEAD_ZONE) {
                joystickDX = 0;
                joystickDY = 0;
            } else {
                joystickDX = dx / d;
                joystickDY = dy / d;
            }
        });

        function releaseAll() {
            joystickActive = false;
            joystickId = null;
            joystickDX = 0;
            joystickDY = 0;
            cursorActive = false;
            keys.up = false;
            keys.down = false;
            keys.left = false;
            keys.right = false;
            keys.a = false;
            keys.b = false;
            keys.jump = false;
        }

        canvas.addEventListener('pointerup', function(e) {
            if (joystickActive && e.pointerId === joystickId) {
                releaseAll();
            }
            keys.a = false;
            keys.b = false;
            keys.jump = false;
            keys.up = false;
            keys.down = false;
            keys.left = false;
            keys.right = false;
        });

        canvas.addEventListener('pointerleave', releaseAll);
        canvas.addEventListener('pointercancel', releaseAll);

        // 键盘备用
        window.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft': keys.left = true; e.preventDefault(); break;
                case 'ArrowRight': keys.right = true; e.preventDefault(); break;
                case 'ArrowUp': keys.up = true; e.preventDefault(); break;
                case 'ArrowDown': keys.down = true; e.preventDefault(); break;
                case ' ': keys.jump = true; e.preventDefault(); break;
                case 'j': case 'J': keys.b = true; break;
                case 'k': case 'K': keys.a = true; break;
            }
        });
        window.addEventListener('keyup', function(e) {
            switch (e.key) {
                case 'ArrowLeft': keys.left = false; break;
                case 'ArrowRight': keys.right = false; break;
                case 'ArrowUp': keys.up = false; break;
                case 'ArrowDown': keys.down = false; break;
                case ' ': keys.jump = false; break;
                case 'j': case 'J': keys.b = false; break;
                case 'k': case 'K': keys.a = false; break;
            }
        });

        console.log('✅ 输入系统初始化完成');

        // ==================== 游戏逻辑 ====================
        let lastBtime = 0;
        let lastAtime = 0;
        let jumpPressed = false;

        function updateCursor() {
            if (cursorActive && (Math.abs(joystickDX) > 0.05 || Math.abs(joystickDY) > 0.05)) {
                const speed = 0.2;
                let nx = cursorTileX + joystick
